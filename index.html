<!DOCTYPE html>
<html lang="pt-br">
<head>

    <link rel="stylesheet" href="style.css">
</head>
<body>

        <div class="conteudo">
            <div class="botoes">

                <button class="botao-objetivo">Passar na faculdade</button>
                <button class="botao-objetivo">Pintar mais</button>
                <button class="botao-objetivo">Melhorar minhas habilidades culinárias</button>
            </div>

            <div class="abas-textos">
                <div class="aba-conteudo">
                    <h3 class="aba-conteudo-titulo-principal">Melhorar o inglês</h3>
                    <h4 class="aba-conteudo-titulo-secundario">Tempo para completar o objetivo</h4>
                    <div class="contador"></div>
                </div>

                <div class="aba-conteudo">
                    <h3 class="aba-conteudo-titulo-principal">Passar na faculdade</h3>
                    <h4 class="aba-conteudo-titulo-secundario">Tempo para completar o objetivo</h4>

                </div>

                <div class="aba-conteudo">
                    <h3 class="aba-conteudo-titulo-principal">Pintar mais</h3>
                    <h4 class="aba-conteudo-titulo-secundario">Tempo para completar o objetivo</h4>
                    <div class="contador"></div>
                </div>

                <div class="aba-conteudo">
                    <h3 class="aba-conteudo-titulo-principal">Melhorar minhas habilidades culinárias</h3>
                    <h4 class="aba-conteudo-titulo-secundario">Tempo para completar o objetivo</h4>
                    <div class="contador"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- SEÇÃO: Carreira (Apenas Links Diretos) -->
    <section class="conteudo-principal">
        <h2 class="titulo-principal">Minha Carreira<span>_</span></h2>
        
        <div class="conteudo">
            <div class="botoes">
                <a href="https://linkedin.com" target="_blank" class="botao-link">LinkedIn</a>
                <a href="https://google.com" target="_blank" class="botao-link">Currículo</a>
            </div>
        </div>
    </section>

    <!-- Adicionado o ?v=2 para obrigar o navegador a recarregar o script do zero -->
    <script src="index.js?v=2"></script>

</html>
