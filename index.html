<!DOCTYPE html>
<html lang="pt-br">

<body>
    <section class="conteudo-principal">
        <h2 class="titulo-principal">Meus Objetivos do ano<span>_</span></h2>
        
        <div class="conteudo">
            <!-- Botões baseados estritamente no seu primeiro bloco -->
            <div class="botoes">
                <button class="botao ativo">Melhorar o inglês</button>
                <button class="botao">Passar na faculdade</button>
                <button class="botao">Pintar mais</button>
                <button class="botao">Melhorar minhas habilidades culinárias</button>
            </div>

            <!-- Abas de texto alinhadas com os botões e com a div contador -->
            <div class="abas-textos">
                <div class="aba-conteudo ativo">
                    <h3 class="aba-conteudo-titulo-principal">Melhorar o inglês</h3>
                    <h4 class="aba-conteudo-titulo-secundario">Tempo para completar o objetivo</h4>
                    <div class="contador"></div>
                </div>

                <div class="aba-conteudo">
                    <h3 class="aba-conteudo-titulo-principal">Passar na faculdade</h3>
                    <h4 class="aba-conteudo-titulo-secundario">Tempo para completar o objetivo</h4>
                    <div class="contador"></div>
                </div>

                <div class="aba-conteudo">
                    <h3 class="aba-conteudo-titulo-principal">Pintar mais</h3>
                    <h4 class="aba-conteudo-titulo-secundario">Tempo para completar o objetivo</h4>
                    <div class="contador"></div>
                </div>

                <div class="aba-conteudo">
                    <h3 class="aba-conteudo-titulo-principal">Melhorar minhas habilidades culinárias</h3>
                    <h4 class="aba-conteudo-titulo-secundario">Tempo para completar o objetivo</h4>
                    <div class="contador"></div>
                </div>
            </div>
        </div>
    </section>

    <script src="index.js"></script>
</body>
</html>
